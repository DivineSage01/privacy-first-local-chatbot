<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lumen Footbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background-text">LUMEN</div>
<div class="app">
    <header class="header">
        <div class="brand">
            <div class="logo">⚡</div>
            <div>
                <h1>Lumen FootBot</h1>
                <span>Offline AI Assistant</span>
            </div>
        </div>
    </header>

    <main class="chat-area" id="chatBox">
        <div class="message bot">
            👋 Hi! I’m <strong>Lumen FootBot</strong>.<br>
            Ask me anything — I work fully offline.
        </div>
    </main>

    <footer class="input-area">
        <input
            type="text"
            id="userInput"
            placeholder="Ask Lumen Footbot..."
            autocomplete="off"
        />
        <button id="sendBtn">➤</button>
    </footer>
</div>

<script src="script.js"></script>
</body>
</html>
